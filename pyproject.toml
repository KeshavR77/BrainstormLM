[project]
name = "brainstormlm"
version = "0.1.0"
description = "BrainstormLM — open-source brainstorming model with steered generation."
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai",
    "together",
    "typer",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "numpy",
    "transformers",
    "torch",
    "peft",
    "trl",
    "accelerate",
    "datasets",
    "modal",
    "fastapi",
    "uvicorn[standard]",

    "asyncpg",
    "sentence-transformers",
    "aiohttp",
    "mauve-text>=0.4.0",
    "nltk",
    "vendi-score",
]

[tool.uv.sources]

[project.scripts]
brainstorm = "brainstormlm.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "tqdm",
    "httpx",
]

[build-system]
requires = ["uv-build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brainstormlm"
module-root = "src"

[tool.ruff]
extend-exclude = [
    ".claude/worktrees",
    ".venv",
    "node_modules",
    "frontend",
    # Parked legacy evaluator (formerly vendored in creativity_steering); kept for reference
    # only, carries its own lint regime — superseded by the top-level creativity_evaluators.
    "old_creativity_evaluators",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "src/wic/*",
]
