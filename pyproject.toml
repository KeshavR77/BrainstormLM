[project]
name = "brainstormlm"
version = "0.1.0"
description = "BrainstormLM — open-source brainstorming model with steered generation."
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai",
    "together",
    "typer",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "numpy",
    "transformers",
    "torch",
    "peft",
    "trl",
    "accelerate",
    "datasets",
    "modal",
    "fastapi",
    "uvicorn[standard]",
    "shrooms-llm",
    "creativity-evaluator",
]

[tool.uv.sources]
shrooms-llm = { path = "../shrooms-llm", editable = true }
creativity-evaluator = { path = "../shrooms-llm/creativity_evaluator", editable = true }

[project.scripts]
brainstorm = "brainstormlm.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "tqdm",
    "httpx",
]

[build-system]
requires = ["uv-build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brainstormlm"
module-root = "src"
