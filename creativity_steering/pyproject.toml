[project]
name = "creativity-steering"
version = "0.1.0"
description = "Derive, analyze, and activation-patch DiffMeans creativity steering vectors at every layer of a Qwen model."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "typer>=0.12",
    "creativity-evaluator",
]

# torch / transformers are only needed for the HF backend (real Qwen). The mock
# backend and the entire analysis/derivation core run on numpy alone, so these
# stay optional to keep offline scaffolding light.
[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.44"]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
creativity-steering = "creativity_steering.cli:app"

[tool.uv.sources]
creativity-evaluator = { path = "../creativity_evaluator", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creativity_steering"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
