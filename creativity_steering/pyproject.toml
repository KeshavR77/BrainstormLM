[project]
name = "creativity-steering"
version = "0.1.0"
description = "Derive, analyze, and activation-patch DiffMeans creativity steering vectors at every layer of a Qwen model."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "typer>=0.12",
]

# This package is standalone: the full creativity_evaluator is vendored under
# src/creativity_evaluator (recovered from the parent repo before its clean-up). Heavy deps
# are optional so the mock backend + heuristic scorer + the whole analysis / derivation core
# run on numpy alone:
#   hf   — real Qwen backend (torch/transformers)
#   real — full vendored creativity_evaluator (Vendi + lexical + embedding + optional LLM judge)
[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.44"]
real = [
    "sentence-transformers>=2.2",
    "vendi-score>=0.0.3",
    "nltk>=3.8",
    "scipy>=1.10",
    "anthropic>=0.25",
    "openai>=1.0",
]
embedding = ["sentence-transformers>=2.2"]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
creativity-steering = "creativity_steering.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creativity_steering", "src/creativity_evaluator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# src/creativity_evaluator is vendored verbatim from the parent repo's former
# creativity_evaluator package; it carries its own lint regime, so exclude it from this
# project's lint (mirrors how the parent repo originally excluded vendored code).
extend-exclude = ["src/creativity_evaluator"]
