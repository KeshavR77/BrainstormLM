[project]
name = "creativity-steering"
version = "0.1.0"
description = "Derive, analyze, and activation-patch DiffMeans creativity steering vectors at every layer of a Qwen model."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "typer>=0.12",
]

# Heavy deps are optional so the mock backend + heuristic scorer + the whole analysis /
# derivation core run on numpy alone:
#   hf        — real Qwen backend (torch/transformers)
#   embedding — self-contained sentence-transformers per-item scorer (factory name "real")
#   evaluator — the two-stage `creativity_evaluators` stack used for evaluator-stack
#               derivation filtering. It is a sibling package at the repo root, imported via a
#               path bridge (see derivation/evaluator_filter.py); its model scorers + LLM
#               judges need `creativity_evaluators[all]` installed for a real run.
[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.44"]
embedding = ["sentence-transformers>=2.2"]
evaluator = ["numpy>=1.24", "scipy>=1.10", "pydantic>=2.0"]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
creativity-steering = "creativity_steering.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["creativity_steering"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Runnable scripts need a sys.path shim for the sibling package before importing it.
"scripts/*" = ["E402"]
