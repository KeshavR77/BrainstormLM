services:
  - type: web
    name: conceptial
    env: python
    plan: free
    region: oregon
    buildCommand: >
      pip install -r requirements-render.txt &&
      PYTHONPATH=src python -c "import brainstormlm.api.server" &&
      cd frontend && VITE_USE_MOCK_DATA=true npm ci && npm run build
    startCommand: PYTHONPATH=src uvicorn brainstormlm.api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: CONCEPTIAL_DEMO
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: BRAINSTORMLM_USER_PROMPT_MAX_CHARS
        value: "2000"
