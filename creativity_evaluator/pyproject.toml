[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creativity-evaluator"
version = "0.1.0"
description = "Multi-dimensional creativity evaluator for LLM outputs"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "vendi-score>=0.0.3",
    "nltk>=3.8",
    "sentence-transformers>=2.2",
    "anthropic>=0.25",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock"]

[tool.hatch.build.targets.wheel]
packages = ["src/creativity_evaluator"]
